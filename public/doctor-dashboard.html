<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard | MediLife</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body data-role="doctor">
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">MediLife Doctor</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span id="userName" class="fw-semibold text-primary"></span>
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="dashboardAlert" class="alert alert-danger d-none"></div>
        <div class="dashboard-heading mb-4">
            <h1 class="h3 fw-bold mb-1">Doctor Dashboard</h1>
            <p class="text-muted mb-0">Only appointments and patients assigned to you are shown.</p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3"><div class="card stat-card"><span>Today</span><strong id="todayCount">0</strong></div></div>
            <div class="col-md-3"><div class="card stat-card status-approved"><span>Approved</span><strong id="approvedCount">0</strong></div></div>
            <div class="col-md-3"><div class="card stat-card status-completed"><span>Completed</span><strong id="completedCount">0</strong></div></div>
            <div class="col-md-3"><div class="card stat-card"><span>Assigned Patients</span><strong id="assignedPatientCount">0</strong></div></div>
        </div>

        <div class="row g-4">
            <div class="col-xl-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0">My Appointments</h2>
                        <span class="badge bg-primary" id="appointmentCount">0</span>
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead><tr><th>Patient</th><th>Date</th><th>Reason</th><th>Status</th><th>Diagnosis</th><th>Actions</th></tr></thead>
                            <tbody id="appointmentTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-xl-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white"><h2 class="h5 mb-0">Assigned Patients</h2></div>
                    <div class="card-body table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>History</th></tr></thead>
                            <tbody id="patientTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="medicalNotesModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="medicalNotesForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Medical Notes</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="notesAppointmentId">
                        <label class="form-label">Diagnosis Notes</label>
                        <textarea id="diagnosisNotes" class="form-control mb-3" rows="3"></textarea>
                        <label class="form-label">Prescription</label>
                        <textarea id="prescription" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save Notes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/role-dashboard.js"></script>
</body>
</html>
